[build-system]
requires=['pdm-backend']
build-backend='pdm.backend'

[project]
name='MPlexA'
description='Scalable multiplex microscopy analysis with segmentation, phenotyping, spatial graphs, and lazy whole-slide visualization.'
authors=[{name='Yujia Hu',email='yujiahu415@gmail.com'}]
readme ='README.md'
requires-python='>=3.9'
license={text='GPL-3.0'}
keywords=['multiplex imaging','spatial biology','whole-slide imaging','cell segmentation']
classifiers=[
  'License :: OSI Approved :: GNU General Public License v3 (GPLv3)',
  'Operating System :: OS Independent',
  'Programming Language :: Python :: 3',
	'Programming Language :: Python :: 3 :: Only',
  'Programming Language :: Python :: 3.9',
	'Programming Language :: Python :: 3.10',
	'Programming Language :: Python :: 3.11',
	'Programming Language :: Python :: 3.12',
	'Programming Language :: Python :: 3.13',
]
dependencies = [
  'numpy<=1.26.4',
  'scipy',
  'scikit-image',
  'tifffile',
  'imagecodecs',
  'opencv-python',
  'xlsxwriter',
  'pandas',
  'wxPython',
  'torch',
  'torchvision',
  'Pillow>=7.1',
  'matplotlib',
  'pycocotools>=2.0.2',
  'termcolor>=1.1',
  'yacs>=0.1.8',
  'tabulate',
  'cloudpickle',
  'tqdm>4.29.0',
  'tensorboard',
  'fvcore>=0.1.5,<0.1.6',
  'iopath>=0.1.7',
  'omegaconf>=2.1,<2.4',
  'hydra-core>=1.1',
  'black',
  'umap-learn>=0.5.6',
  'python-igraph>=0.11.4',
  'leidenalg>=0.10.2',
]
dynamic=['version']

[project.optional-dependencies]
zarr=[
  "zarr==2.17.2; python_version<'3.11'",
  "zarr>=2.18.7,<3; python_version>='3.11'",
  'numcodecs>=0.10,<0.16',
]
dev = ["pytest"]

[project.urls]
Homepage='https://github.com/yujiahu415/MPlexA'

[project.scripts]
MPlexA='MPlexA.__main__:main'
mplexa ='MPlexA.__main__:main'

[tool.pdm]
distribution=true

[tool.pdm.version]
source='file'
path='MPlexA/__init__.py'
